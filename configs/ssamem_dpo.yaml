runtime:
  runtime_mode: hf
  device: cuda
  trust_remote_code: true

data:
  preferences: data/pointer_prefs.jsonl

training:
  base_model: Qwen/Qwen3-4B-Instruct-2507
  load_in_4bit: true
  lora:
    r: 128
    alpha: 32
    target_modules:
      - q_proj
      - v_proj
  dpo:
    beta: 0.1
    max_prompt_length: 1024
    max_completion_length: 16
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 32
    learning_rate: 0.00005
    num_train_epochs: 1
    output_dir: outputs/pointer_dpo_adapter
